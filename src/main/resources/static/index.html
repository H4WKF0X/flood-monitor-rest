<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flood Monitor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="container-fluid">
    <nav>
        <ul>
            <li>
                <hgroup>
                    <h1>Flood Monitor</h1>
                    <p>Live river levels</p>
                </hgroup>
            </li>
        </ul>
        <ul>
            <li>
                <select id="format" aria-label="Response format">
                    <option value="json">JSON</option>
                    <option value="xml">XML</option>
                </select>
            </li>
            <li><small id="lastUpdate"></small></li>
        </ul>
    </nav>
</header>

<main class="container-fluid">
    <section id="alertBanner" hidden></section>
    <p id="message"></p>

    <div class="layout">
        <aside id="stationList"></aside>

        <section id="stationDetails">
            <h2 id="stationTitle">Select a station</h2>

            <div id="latest"></div>

            <form id="rangeForm">
                <div class="grid">
                    <label>From
                        <input type="datetime-local" id="filterFrom">
                    </label>
                    <label>To
                        <input type="datetime-local" id="filterTo">
                    </label>
                </div>
                <div class="actions">
                    <button type="submit">Apply range</button>
                    <button type="button" id="resetRange" class="secondary">Reset</button>
                </div>
            </form>

            <div id="statistics"></div>

            <nav id="chartTabs"></nav>
            <canvas id="chart"></canvas>

            <details id="historySection">
                <summary id="historySummary">Measurement history</summary>
                <div class="grid">
                    <label>Warning level
                        <select id="filterLevel">
                            <option value="">All</option>
                            <option>NORMAL</option>
                            <option>WARNING</option>
                            <option>CRITICAL</option>
                            <option>UNKNOWN</option>
                        </select>
                    </label>
                    <label>Limit
                        <input type="number" id="filterLimit" value="25" min="1">
                    </label>
                </div>
                <div id="history"></div>
            </details>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
